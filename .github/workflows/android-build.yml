name: Build OMKAR AUTOMATIC VIDEO MAKER APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version

      - name: Make Gradle executable
        shell: bash
        run: |
          test -f ./gradlew
          chmod +x ./gradlew

      - name: Verify Gradle
        shell: bash
        run: |
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for generated APK..."
          find . -type f -name "*.apk" -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release-apk

          APK=$(find . -type f -name "*.apk" | head -n 1)

          echo "Using APK:"
          echo "$APK"

          cp "$APK" \
            release-apk/OMKAR-AUTOMATIC-VIDEO-MAKER-debug.apk

          test -f \
            release-apk/OMKAR-AUTOMATIC-VIDEO-MAKER-debug.apk

          ls -lh release-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMKAR-AUTOMATIC-VIDEO-MAKER-debug
          path: release-apk/OMKAR-AUTOMATIC-VIDEO-MAKER-debug.apk
          if-no-files-found: error
          retention-days: 7
